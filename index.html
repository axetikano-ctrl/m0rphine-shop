<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>m0rphine — Gothic Store</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Анимированный фон -->
  <div class="bg-animation">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>

  <!-- Шапка -->
  <header class="header">
    <div class="logo">
      <span class="logo-plus">+</span>
      <h1>m0rphine</h1>
    </div>
    <div class="header-actions">
      <button class="icon-btn" onclick="toggleSearch()" title="Поиск">
        🔍
      </button>
      <button class="cart-btn" onclick="openCart()">
        <span class="cart-icon">🛒</span>
        <span class="cart-badge" id="cart-count">0</span>
      </button>
    </div>
  </header>

  <!-- Поиск -->
  <div class="search-container" id="search-container">
    <input type="text" id="search-input" placeholder="Поиск товаров..." oninput="searchProducts()">
  </div>

  <!-- Фильтры -->
  <div class="filters">
    <button class="filter-btn active" onclick="filterCategory('all')">Все</button>
    <button class="filter-btn" onclick="filterCategory('jewelry')">Украшения</button>
    <button class="filter-btn" onclick="filterCategory('clothing')">Одежда</button>
    <button class="filter-btn" onclick="filterCategory('accessories')">Аксессуары</button>
  </div>

  <!-- Сортировка -->
  <div class="sort-container">
    <select id="sort-select" onchange="sortProducts()">
      <option value="default">Сортировка</option>
      <option value="price-asc">Цена: по возрастанию</option>
      <option value="price-desc">Цена: по убыванию</option>
      <option value="name">По названию</option>
    </select>
  </div>

  <!-- Товары -->
  <main id="products" class="products-grid"></main>

  <!-- Корзина -->
  <div id="cart-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>🛒 Корзина</h2>
        <button class="close-btn" onclick="closeCart()">✕</button>
      </div>
      <div id="cart-items" class="cart-items"></div>
      <div class="cart-footer">
        <div class="total">
          <span>Итого:</span>
          <span id="total-price">0 ₽</span>
        </div>
        <button class="checkout-btn" onclick="checkout()">
          Оформить заказ 
        </button>
        <button class="clear-cart-btn" onclick="clearCart()">
          Очистить корзину
        </button>
      </div>
    </div>
  </div>

  <!-- Уведомления -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Загрузка -->
  <div id="loader" class="loader">
    <div class="loader-spinner"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
